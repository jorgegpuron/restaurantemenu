name: Desplegar carta a socialcard.es

# Cada push a main compila la carta y sube SOLO 2-subir/ al hosting.
#
# Un unico interruptor manda: la variable de repositorio DESPLIEGUE_REAL.
#   - Si no existe (o no vale "true"), TODO run es un ensayo: calcula y lista los cambios
#     pero no escribe nada en el servidor.
#   - Si vale "true", cada push a main publica.
#
# Lo que este workflow NO hace nunca:
#   - Borrar en espejo. No se usa dangerous-clean-slate, que borraria el server-dir entero
#     incluido lo excluido.
#   - Tocar nada fuera de FTP_REMOTE_PATH.
#   - Subir o pisar lo que escribe el panel en produccion: contrasenas, estado del dia,
#     records del juego, fotos que sube el restaurante y contadores de visitas.
#
# La lista de exclusiones de abajo no es teorica: cada linea protege datos que existen ahora
# mismo en el servidor.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo un despliegue a la vez. Dos subidas FTP simultaneas sobre la misma carpeta dejan la
# carta a medias: el panel nuevo con el index viejo, que es el fallo que mas caro sale.
# cancel-in-progress va en false a proposito: cortar un FTP por la mitad es peor que esperar.
concurrency:
  group: deploy-ftp-tinge
  cancel-in-progress: false

# El workflow no necesita escribir en el repositorio.
permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest

    steps:
      # gen.mjs comprueba que el nombre de la carpeta que contiene 1-proyecto aparezca en
      # cliente.mjs -> base. Es un detector de restos de otro restaurante y aborta el build si
      # no cuadra. Por eso el checkout va a tinge_of_turmeric/1-proyecto y no a la raiz: asi
      # carpetaCliente = "tinge_of_turmeric", que si esta en la direccion publica.
      # De paso, ../2-subir cae dentro del workspace en vez de fuera.
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tinge_of_turmeric/1-proyecto
          persist-credentials: false

      # Node 24: es el LTS vigente y el mismo que se usa para compilar en local. Node 20 esta
      # fuera de soporte desde abril de 2026.
      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Si FTP_REMOTE_PATH faltara, server-dir quedaria vacio y la subida iria a la RAIZ del
      # FTP, encima de las otras webs de la cuenta. Se comprueba antes de conectar.
      - name: Comprobar la ruta de despliegue
        env:
          RUTA: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          if [ -z "$RUTA" ]; then
            echo "::error::FTP_REMOTE_PATH esta vacio o no existe."
            exit 1
          fi
          case "$RUTA" in
            /) echo "::error::FTP_REMOTE_PATH es la raiz del FTP."; exit 1 ;;
            /*/) echo "Ruta de despliegue validada." ;;
            *) echo "::error::FTP_REMOTE_PATH debe empezar y terminar en barra: /carpeta/sub/"
               exit 1 ;;
          esac

      # Sin package.json ni dependencias: gen.mjs solo usa node:fs, node:crypto y modulos del
      # propio repositorio. No hay npm ci que hacer ni cache que guardar.
      - name: Compilar la carta
        working-directory: tinge_of_turmeric/1-proyecto
        run: node gen.mjs

      # Una carta rota es peor que una carta vieja. Si el build no dejo lo minimo, se para aqui
      # y el servidor se queda como estaba.
      - name: Comprobar lo compilado
        working-directory: tinge_of_turmeric/2-subir
        run: |
          for f in index.html juego.html version.json admin/index.php; do
            if [ ! -s "$f" ]; then
              echo "::error::Falta o esta vacio: $f. No se sube nada."
              exit 1
            fi
          done
          # Si un dia el build empezara a generar datos de produccion, nos enteramos aqui y no
          # pisandolos en el servidor.
          for f in estado.json record.json admin/clave.php admin/superclave.php; do
            if [ -e "$f" ]; then
              echo "::error::El build ha generado $f, que es un dato de produccion. Abortado."
              exit 1
            fi
          done
          echo "Compilado correcto: $(find . -type f | wc -l) ficheros, $(du -sh . | cut -f1)"
          echo "Build: $(cat version.json)"

      # Las tres actions van fijadas al SHA del commit, no a la etiqueta: una etiqueta se puede
      # reescribir para que apunte a otro codigo, y esta recibe las credenciales FTP.
      # Para actualizar: mira la release nueva, coge su SHA y cambia SHA y comentario a la vez.
      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          local-dir: ./tinge_of_turmeric/2-subir/
          # FTPS con verificacion completa del certificado.
          #
          # FTP_SERVER tiene que ser el nombre del servidor de cPanel
          # (Server Information > Server Name + ".prod.phx3.secureserver.net"), NO el dominio.
          # El FTP presenta un certificado de *.prod.phx3.secureserver.net, legitimo y de una
          # CA publica, pero emitido para la infraestructura del hosting. Conectando por el
          # dominio el nombre no cuadra y hay que renunciar a comprobarlo; conectando por el
          # nombre del servidor, valida.
          #
          # Con security: strict el canal va cifrado Y se comprueba con quien se habla. La
          # contrapartida: si GoDaddy dejara caducar ese certificado o migrara la cuenta a otro
          # servidor, el despliegue fallaria al conectar hasta actualizar FTP_SERVER. Falla
          # antes de tocar ficheros, asi que no deja la carta a medias.
          protocol: ftps
          security: strict
          # El unico interruptor. Sin la variable puesta a "true", esto es siempre un ensayo.
          dry-run: ${{ vars.DESPLIEGUE_REAL != 'true' }}
          log-level: standard
          # Lo excluido no se sube y tampoco se borra: son datos del servidor, no del proyecto.
          exclude: |
            **/.git*
            **/.git*/**
            estado.json
            record.json
            assets/hero/**
            assets/platos/**
            admin/clave.php
            admin/superclave.php
            admin/intentos.json
            admin/accesos.log
            admin/canjes.json
            admin/marcador.json
            admin/permitir-hash.txt
            admin/copias/**
            admin/datos/**
            admin/acceso*.jpg
            LEEME-SERVIDOR.txt

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue de la carta"
            echo ""
            echo "- Modo: ${{ vars.DESPLIEGUE_REAL == 'true' && 'DESPLIEGUE REAL' || 'ENSAYO — no se ha subido nada' }}"
            echo "- Borrado en espejo: desactivado"
            echo "- Datos del panel en produccion: excluidos"
          } >> "$GITHUB_STEP_SUMMARY"
